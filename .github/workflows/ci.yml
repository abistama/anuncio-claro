name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:all
      # Validate the Firefox build the way addons.mozilla.org will on upload.
      # Fails only on errors; innerHTML warnings are informational.
      - run: npx --yes addons-linter@7 dist-firefox
      - uses: actions/upload-artifact@v7
        with:
          name: anuncio-claro-chrome
          path: dist
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: anuncio-claro-firefox
          path: dist-firefox
          if-no-files-found: error
